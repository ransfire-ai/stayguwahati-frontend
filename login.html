<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGuwahati | Portal Access</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between font-sans">

    <header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-house-chimney text-teal-600 text-xl sm:text-2xl"></i>
                <span class="text-lg sm:text-xl font-bold text-teal-800 tracking-tight">Stay<span class="text-teal-600">Guwahati</span></span>
            </div>
            <nav class="flex items-center gap-3 text-xs font-bold text-gray-500">
                <select id="langSelector" class="bg-gray-50 border border-gray-200 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-teal-500 font-semibold text-gray-700 cursor-pointer shadow-sm">
                    <option value="en">English</option>
                    <option value="as">অসমীয়া</option>
                    <option value="hi">हिंदी</option>
                </select>
            </nav>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-gray-100 max-w-sm w-full my-auto">
            <div class="text-center mb-6 sm:mb-8">
                <div class="bg-teal-50 text-teal-600 w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex items-center justify-center mx-auto text-xl sm:text-2xl mb-4 shadow-inner">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h1 id="loginTitle" class="text-xl sm:text-2xl font-black text-gray-900 tracking-tight">Welcome Back</h1>
                <p id="loginSubtitle" class="text-gray-400 text-xs mt-1">Access your secure profile pipeline</p>
            </div>

            <div id="errorBanner" class="hidden bg-rose-50 border border-rose-100 text-rose-600 text-xs p-3 rounded-xl mb-4 font-medium">
                <i class="fa-solid fa-circle-exclamation mr-1.5"></i> <span id="errorMessage">Invalid credentials</span>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label id="labelEmail" class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-teal-500 transition focus:ring-1 focus:ring-teal-500">
                </div>

                <div>
                    <label id="labelPassword" class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Password</label>
                    <input type="password" id="password" required placeholder="••••••••"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-teal-500 transition focus:ring-1 focus:ring-teal-500">
                </div>

                <div class="flex items-center justify-between text-xs font-medium pt-1">
                    <label class="flex items-center gap-2 text-gray-500 cursor-pointer select-none">
                        <input type="checkbox" class="accent-teal-600 rounded"> <span id="labelRemember">Remember session</span>
                    </label>
                    <a href="forgot-password.html" id="forgotPwd" class="text-teal-600 font-bold hover:underline">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-slate-900 hover:bg-teal-600 text-white font-bold py-3 rounded-xl text-sm transition mt-2 flex items-center justify-center gap-2 shadow-sm">
                    <span id="btnText">Secure Access</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
            
            <div class="mt-6 sm:mt-8 text-center text-xs text-gray-500">
                <span id="registerPrompt">New to our network?</span> <a href="register.html" id="registerLink" class="text-teal-600 font-bold hover:underline">Create an account</a>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 px-4 text-[10px] text-gray-400 border-t border-gray-100 bg-white sm:bg-transparent sm:border-t-0">
        <p>&copy; 2026 StayGuwahati Platform Unified Core. All rights reserved.</p>
        <a href="privacy.html" class="hover:text-teal-600 underline mt-1 inline-block">Privacy Policy</a>
    </footer>

    <script>
        const BACKEND_URL = 'https://stayguwahati-backend.onrender.com';

        const dictionary = {
            en: { login: "Welcome Back", sub: "Access your secure profile pipeline", email: "Email Address", pass: "Password", rem: "Remember session", forg: "Forgot password?", btn: "Secure Access", reg: "New to our network?", regLink: "Create an account" },
            as: { login: "নমস্কাৰ", sub: "আপোনাৰ সুৰক্ষিত প্ৰফাইল পাইপলাইনত প্ৰৱেশ কৰক", email: "ইমেইল ঠিকনা", pass: "পাছৱৰ্ড", rem: "ছেছন মনত ৰাখক", forg: "পাছৱৰ্ড পাহৰিলে?", btn: "সুৰক্ষিত প্ৰৱেশ", reg: "নেটৱৰ্কত নতুন?", regLink: "একাউন্ট সৃষ্টি কৰক" },
            hi: { login: "नमस्ते", sub: "अपने सुरक्षित प्रोफ़ाइल पाइपलाइन तक पहुंचें", email: "ईमेल पता", pass: "पासवर्ड", rem: "सत्र याद रखें", forg: "पासवर्ड भूल गए?", btn: "सुरक्षित प्रवेश", reg: "नेटवर्क में नए हैं?", regLink: "खाता बनाएं" }
        };

        const langSelector = document.getElementById("langSelector");

        function applyLanguage(lang) {
            const t = dictionary[lang] || dictionary.en;
            document.getElementById("loginTitle").textContent = t.login;
            document.getElementById("loginSubtitle").textContent = t.sub;
            document.getElementById("labelEmail").textContent = t.email;
            document.getElementById("labelPassword").textContent = t.pass;
            document.getElementById("labelRemember").textContent = t.rem;
            document.getElementById("forgotPwd").textContent = t.forg;
            document.getElementById("btnText").textContent = t.btn;
            document.getElementById("registerPrompt").textContent = t.reg;
            document.getElementById("registerLink").textContent = t.regLink;
            document.documentElement.lang = lang;
        }

        if (langSelector) {
            langSelector.addEventListener("change", (e) => {
                const selectedLang = e.target.value;
                localStorage.setItem("preferredLanguage", selectedLang);
                applyLanguage(selectedLang);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Check sessionStorage for active login session
            const token = sessionStorage.getItem("token") || sessionStorage.getItem("authToken");
            const userProfile = sessionStorage.getItem("userProfile");
            const lang = localStorage.getItem("preferredLanguage") || "en";
            
            if (langSelector) langSelector.value = lang;
            applyLanguage(lang);

            // Smart auto-redirect if already logged in based on role
            if (token && userProfile) {
                try {
                    const user = JSON.parse(userProfile);
                    const isAdmin = user.role === "admin" || user.role === "ADMIN" || user.isAdmin === true || user.type === "admin";
                    window.location.href = isAdmin ? "admin.html" : "dashboard.html";
                } catch (e) {
                    window.location.href = "dashboard.html";
                }
            }
        });

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorBanner = document.getElementById("errorBanner");
            const errorMessage = document.getElementById("errorMessage");
            const submitBtn = document.getElementById("submitBtn");

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...`;

            try {
                const response = await fetch(`${BACKEND_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && (data.token || data.accessToken)) {
                    // Save token and profile to sessionStorage so it clears on browser close
                    const token = data.token || data.accessToken;
                    const user = data.user || data.profile;
                    
                    sessionStorage.setItem('token', token);
                    sessionStorage.setItem('userProfile', JSON.stringify(user));

                    // Evaluate role status
                    const isAdmin = 
                        user.role === "admin" || 
                        user.role === "ADMIN" || 
                        user.isAdmin === true || 
                        user.type === "admin";                

                    const userRole = isAdmin ? "admin" : "traveler";
                    sessionStorage.setItem("activeDashboardRole", userRole);  

                    // Conditional Routing
                    if (isAdmin) {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "dashboard.html";
                    }
                } else {
                    errorMessage.textContent = data.message || "Invalid credentials";
                    errorBanner.classList.remove("hidden");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Secure Access</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
                }
            } catch (err) {
                errorMessage.textContent = err.message || "Server communication error";
                errorBanner.classList.remove("hidden");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Secure Access</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
            }
        });
    </script>
</body>
</html>
