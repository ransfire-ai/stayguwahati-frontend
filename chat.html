<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat with Host | StayGuwahati</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-dvh flex items-center justify-center p-0 sm:p-4 antialiased selection:bg-teal-100">

    <!-- Container: Fullscreen on mobile (100dvh), centered card on tablet/desktop -->
    <div class="bg-white w-full h-[100dvh] sm:h-[620px] sm:max-w-md flex flex-col sm:rounded-2xl sm:shadow-2xl sm:border border-gray-100 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-teal-700 text-white px-4 py-3 sm:py-4 flex items-center justify-between shrink-0 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center font-bold text-white shrink-0">
                    <i class="fa-solid fa-house-chimney text-lg"></i>
                </div>
                <div>
                    <h1 id="hostTitle" class="font-bold text-base sm:text-sm leading-tight">StayGuwahati Host Chat</h1>
                    <p id="propertySub" class="text-xs text-teal-100 opacity-90">Green Villa</p>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
                <span class="text-[11px] text-teal-100 font-medium">Online</span>
            </div>
        </div>

        <!-- Chat History Container -->
        <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 overscroll-contain text-sm sm:text-xs">
            <div class="bg-white p-3.5 rounded-2xl border border-gray-200 text-gray-700 shadow-xs max-w-[85%] rounded-tl-none">
                <p class="leading-relaxed">Hello! Welcome to StayGuwahati. How can we help you today?</p>
            </div>
        </div>

        <!-- Sticky Mobile Input Bar -->
        <form onsubmit="sendMessage(event)" class="p-3 bg-white border-t border-gray-100 flex items-center gap-2 shrink-0 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
            <input 
                type="text" 
                id="chatInput" 
                placeholder="Type your message..." 
                class="flex-1 border border-gray-200 rounded-full px-4 py-2.5 text-[16px] sm:text-xs focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600 font-medium bg-gray-50 focus:bg-white transition" 
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                class="bg-teal-700 text-white font-bold h-10 w-10 sm:w-auto sm:px-5 rounded-full text-xs hover:bg-teal-800 active:scale-95 transition flex items-center justify-center shrink-0 shadow-sm"
                aria-label="Send message"
            >
                <span class="hidden sm:inline">Send</span>
                <i class="fa-solid fa-paper-plane sm:hidden text-sm"></i>
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const guestName = urlParams.get('guest') || 'Guest';
        const property = urlParams.get('property') || 'Green Villa';
        const BACKEND_URL = 'https://stayguwahati-backend.onrender.com';

        document.getElementById('propertySub').textContent = property;

        let lastMessageCount = 0;

        // Fetch and render chat history dynamically from MongoDB
        async function fetchMessages() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/messages?propertyTitle=${encodeURIComponent(property)}&guestName=${encodeURIComponent(guestName)}`);
                const result = await response.json();

                if (result.success && Array.isArray(result.data)) {
                    // Only re-render if message count changes to prevent layout flicker on touch screen
                    if (result.data.length !== lastMessageCount) {
                        renderMessages(result.data);
                        lastMessageCount = result.data.length;
                    }
                }
            } catch (err) {
                console.error("Error fetching messages:", err);
            }
        }

        // Render message bubbles cleanly
        function renderMessages(messages) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';

            if (messages.length === 0) {
                chatBox.innerHTML = `
                    <div class="bg-white p-3.5 rounded-2xl border border-gray-200 text-gray-700 shadow-xs max-w-[85%] rounded-tl-none">
                        <p class="leading-relaxed">Hello! Welcome to StayGuwahati. How can we help you today?</p>
                    </div>
                `;
                return;
            }

            messages.forEach(msg => {
                const isSelf = msg.senderName === guestName;
                const bubbleWrapper = document.createElement('div');
                bubbleWrapper.className = isSelf ? 'flex justify-end' : 'flex justify-start';

                if (isSelf) {
                    bubbleWrapper.innerHTML = `
                        <div class="bg-teal-700 text-white p-3.5 rounded-2xl rounded-tr-none max-w-[85%] shadow-xs">
                            <p class="leading-relaxed break-words">${escapeHTML(msg.message)}</p>
                        </div>
                    `;
                } else {
                    bubbleWrapper.innerHTML = `
                        <div class="bg-white p-3.5 rounded-2xl rounded-tl-none border border-gray-200 text-gray-700 shadow-xs max-w-[85%]">
                            <p class="font-bold text-[11px] text-teal-700 mb-1">${escapeHTML(msg.senderName || 'Host')}</p>
                            <p class="leading-relaxed break-words">${escapeHTML(msg.message)}</p>
                        </div>
                    `;
                }
                chatBox.appendChild(bubbleWrapper);
            });

            // Smooth scroll to bottom on new message
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        // Send new message to server
        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = '';

            try {
                await fetch(`${BACKEND_URL}/api/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        senderName: guestName,
                        guestName: guestName,
                        propertyTitle: property,
                        message: msg
                    })
                });

                // Immediately fetch to render new message
                fetchMessages();
            } catch (err) {
                console.error("Error sending message:", err);
            }
        }

        // Helper to prevent XSS script execution
        function escapeHTML(str) {
            return str ? str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            ) : '';
        }

        // Initial fetch and 3-second live polling
        fetchMessages();
        setInterval(fetchMessages, 3000);
    </script>
</body>
</html>
