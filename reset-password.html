<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGuwahati | Set New Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between font-sans antialiased">

    <header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-house-chimney text-teal-600 text-xl sm:text-2xl"></i>
                <span class="text-lg sm:text-xl font-bold text-teal-800 tracking-tight">StayGuwahati</span>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
        <div class="bg-white p-6 sm:p-8 rounded-2xl sm:rounded-3xl shadow-sm border border-gray-100 max-w-md w-full">
            <div class="text-center mb-6 sm:mb-8">
                <div class="bg-teal-50 text-teal-600 w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex items-center justify-center mx-auto text-xl sm:text-2xl mb-3 sm:mb-4 shadow-inner">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-black text-gray-900 tracking-tight">New Password</h1>
                <p class="text-gray-400 text-xs mt-1">Please enter your secure new password</p>
            </div>

            <div id="statusBanner" class="hidden p-3 rounded-xl mb-4 text-xs font-medium border">
                <i id="statusIcon" class="fa-solid mr-1.5"></i> <span id="statusMessage"></span>
            </div>

            <form id="resetForm" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">New Password</label>
                    <input type="password" id="newPassword" required placeholder="••••••••"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-teal-500 transition focus:ring-1 focus:ring-teal-500">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-teal-500 transition focus:ring-1 focus:ring-teal-500">
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-slate-900 hover:bg-teal-600 text-white font-bold py-3 rounded-xl text-sm transition mt-2 flex items-center justify-center gap-2 shadow-sm">
                    <span id="btnText">Update Password</span>
                </button>
            </form>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-gray-400 border-t border-gray-100 bg-white px-4">
        <p>&copy; 2026 StayGuwahati Platform Unified Core.</p>
    </footer>

    <script>
        const resetForm = document.getElementById("resetForm");
        const statusBanner = document.getElementById("statusBanner");
        const statusMessage = document.getElementById("statusMessage");
        const statusIcon = document.getElementById("statusIcon");
        const submitBtn = document.getElementById("submitBtn");

        // Extract token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showError("Invalid link: No token found.");
            resetForm.classList.add("hidden");
        }

        resetForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
                showError("Passwords do not match.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...`;

            try {
                const response = await fetch('http://localhost:5000/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Reset failed.");

                // Success
                statusBanner.className = "p-3 rounded-xl mb-4 text-xs font-medium border bg-emerald-50 border-emerald-100 text-emerald-600";
                statusIcon.className = "fa-solid fa-check-circle mr-1.5";
                statusMessage.textContent = "Success! Redirecting to login...";
                statusBanner.classList.remove("hidden");
                
                setTimeout(() => window.location.href = "login.html", 2000);

            } catch (err) {
                showError(err.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Update Password";
            }
        });

        function showError(msg) {
            statusBanner.className = "p-3 rounded-xl mb-4 text-xs font-medium border bg-rose-50 border-rose-100 text-rose-600";
            statusIcon.className = "fa-solid fa-circle-exclamation mr-1.5";
            statusMessage.textContent = msg;
            statusBanner.classList.remove("hidden");
        }
    </script>
    <script src="lang-manager.js"></script>
</body>
</html>
