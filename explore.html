<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGuwahati - Verified Local Homestays</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-house-chimney text-teal-600 text-2xl"></i>
                <span class="text-xl font-bold text-teal-800">StayGuwahati</span>
            </div>
            
            <nav class="flex items-center gap-6 text-sm font-medium text-gray-600">
                <a href="index.html" id="navHome" class="text-teal-600 border-b-2 border-teal-600 pb-1">Home</a>
                <a href="map.html" id="navMap" class="hover:text-teal-600 transition">Explore Map</a>
                <a href="add-property.html" id="navProperty" class="hover:text-teal-600 transition">List Property</a>
                
                <select id="langSelector" class="ml-4 bg-gray-50 border border-gray-200 rounded-lg p-1 text-xs font-bold text-gray-700 cursor-pointer">
                    <option value="en">English</option>
                    <option value="as">অসমীয়া</option>
                    <option value="hi">हिंदी</option>
                </select>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
            <div>
                <h1 id="mainTitle" class="text-3xl font-extrabold text-gray-900 tracking-tight">Verified Local Homestays</h1>
                <p id="mainDesc" class="text-gray-500 mt-1 text-sm md:text-base">Handpicked properties verified for hygiene, security, and warmth.</p>
            </div>
            <div class="bg-teal-50 text-teal-700 px-4 py-2 rounded-full text-sm font-semibold border border-teal-100 self-start md:self-auto">
                Showing <span id="propertyCount">0</span> <span id="showingLabel">active property options</span>
            </div>
        </div>

        <div id="homestayGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-12 text-gray-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-teal-500"></i>
                <p>Connecting to database pipeline...</p>
            </div>
        </div>
    </main>

    <script src="lang-manager.js"></script>
    <script>
        async function loadVerifiedHomestays() {
            const grid = document.getElementById("homestayGrid");
            const countLabel = document.getElementById("propertyCount");
            const BACKEND_URL = 'https://stayguwahati-backend.onrender.com';

            try {
                const response = await fetch(`${BACKEND_URL}/api/homestays`);
                let properties = await response.json();
                if (properties && properties.data) properties = properties.data;

                countLabel.textContent = properties.length;

                if (!properties || properties.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16 bg-white border border-gray-200 rounded-2xl shadow-sm">
                            <i class="fa-solid fa-hotel text-4xl text-gray-300 mb-3"></i>
                            <p class="font-semibold text-gray-700">No properties found</p>
                        </div>`;
                    return;
                }

                grid.innerHTML = "";
                properties.forEach(stay => {
    console.log("Current Stay Object:", stay); // Keep this to debug if ID is missing
    
    let img = "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600";
    if (stay.images && stay.images.length > 0) {
        img = stay.images[0].startsWith('/uploads') ? `${BACKEND_URL}${stay.images[0]}` : stay.images[0];
    }

    grid.innerHTML += `
        <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition duration-300 flex flex-col group">
            <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                <img src="${img}" alt="${stay.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            </div>
            <div class="p-5 flex-1 flex flex-col justify-between">
                <div>
                    <span class="text-[10px] font-bold text-teal-600 uppercase tracking-widest">${stay.locality || 'Guwahati'}</span>
                    <h3 class="font-bold text-lg text-gray-900 mt-1 truncate">${stay.title}</h3>
                </div>
                <div class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-between">
                    <span class="text-xl font-extrabold text-gray-900">₹${stay.pricePerNight}</span>
                    
                    <button onclick="window.location.href='book-stay.html?id=${stay._id}'" 
                            class="bg-slate-900 hover:bg-teal-600 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-sm">
                        Reserve
                    </button>
                </div>
            </div>
        </div>`;
});
            } catch (error) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-rose-500 bg-rose-50 rounded-2xl">Pipeline Error: Check if backend is running on port 5000.</div>`;
            }
        }

        // Initialize
        document.addEventListener("DOMContentLoaded", () => {
            // Apply language first
            if (typeof applyLanguage === 'function') {
                const lang = localStorage.getItem("preferredLang") || "en";
                applyLanguage(lang);
            }
            // Then fetch data
            loadVerifiedHomestays();
        });
    </script>
</body>
</html>
