<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGuwahati - Verified Local Homestays</title>
    <!-- Favicon inline fix -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans flex flex-col justify-between antialiased">

    <!-- Re-aligned Header Navigation -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            
            <!-- Brand Logo (Left) -->
            <div class="flex items-center gap-2.5 cursor-pointer shrink-0" onclick="window.location.href='index.html'">
                <div class="w-9 h-9 bg-teal-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-teal-600/20">
                    <i class="fa-solid fa-house-chimney-window text-base"></i>
                </div>
                <span class="text-lg sm:text-xl font-black tracking-tight text-slate-900">Stay<span class="text-teal-600">Guwahati</span></span>
            </div>
            
            <!-- Navigation Links & Language Selector (Right) -->
            <nav class="flex items-center gap-3 sm:gap-6 text-xs sm:text-sm font-semibold text-slate-600 overflow-x-auto scrollbar-hide py-1">
                <a href="index.html" id="navHome" class="text-teal-600 border-b-2 border-teal-600 pb-1 font-bold whitespace-nowrap">Home</a>
                <a href="map.html" id="navMap" class="hover:text-teal-600 transition pb-1 whitespace-nowrap">Explore Map</a>
                <a href="add-property.html" id="navProperty" class="hover:text-teal-600 transition pb-1 whitespace-nowrap">List Property</a>
                
                <select id="langSelector" class="bg-slate-100 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs font-bold text-slate-700 cursor-pointer focus:outline-none shrink-0">
                    <option value="en">English</option>
                    <option value="as">অসমীয়া</option>
                    <option value="hi">हिंदी</option>
                </select>
            </nav>

        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6 sm:mb-8">
            <div>
                <h1 id="mainTitle" class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">Verified Local Homestays</h1>
                <p id="mainDesc" class="text-slate-500 mt-1 text-xs sm:text-sm md:text-base font-medium">Handpicked properties verified for hygiene, security, and warmth.</p>
            </div>
            <div class="bg-teal-50 text-teal-700 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-bold border border-teal-100 self-start sm:self-auto">
                Showing <span id="propertyCount">0</span> <span id="showingLabel">active property options</span>
            </div>
        </div>

        <div id="homestayGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-8">
            <div class="col-span-full text-center py-12 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-teal-500"></i>
                <p class="text-xs sm:text-sm">Connecting to database pipeline...</p>
            </div>
        </div>
    </main>

    <footer class="text-center py-5 px-3 text-xs text-slate-400 border-t border-slate-100 bg-white mt-12 shrink-0">
        &copy; 2026 StayGuwahati Platform Unified Core Engine. All rights reserved.
    </footer>

    <script src="lang-manager.js"></script>
    <script>
        async function loadVerifiedHomestays() {
            const grid = document.getElementById("homestayGrid");
            const countLabel = document.getElementById("propertyCount");
            const BACKEND_URL = 'https://stayguwahati-backend.onrender.com';

            try {
                const response = await fetch(`${BACKEND_URL}/api/homestays`);
                let properties = await response.json();
                if (properties && properties.data) properties = properties.data;

                countLabel.textContent = properties.length;

                if (!properties || properties.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16 bg-white border border-slate-200 rounded-2xl shadow-sm">
                            <i class="fa-solid fa-hotel text-4xl text-slate-300 mb-3"></i>
                            <p class="font-bold text-slate-700 text-xs sm:text-sm">No properties found</p>
                        </div>`;
                    return;
                }

                grid.innerHTML = "";
                properties.forEach(stay => {
                    console.log("Current Stay Object:", stay);
                    
                    let img = "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600";
                    if (stay.images && stay.images.length > 0) {
                        img = stay.images[0].startsWith('/uploads') ? `${BACKEND_URL}${stay.images[0]}` : stay.images[0];
                    }

                    grid.innerHTML += `
                        <div class="bg-white border border-slate-200/80 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition duration-300 flex flex-col group">
                            <div class="relative overflow-hidden aspect-[4/3] bg-slate-100">
                                <img src="${img}" alt="${stay.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            </div>
                            <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between">
                                <div>
                                    <span class="text-[10px] font-extrabold text-teal-600 uppercase tracking-widest">${stay.locality || 'Guwahati'}</span>
                                    <h3 class="font-bold text-base sm:text-lg text-slate-900 mt-1 truncate">${stay.title}</h3>
                                </div>
                                <div class="mt-4 sm:mt-6 pt-3 sm:pt-4 border-t border-slate-100 flex items-center justify-between">
                                    <span class="text-lg sm:text-xl font-black text-slate-900">₹${stay.pricePerNight}</span>
                                    
                                    <button onclick="window.location.href='book-stay.html?id=${stay._id}'" 
                                            class="bg-slate-900 hover:bg-teal-600 text-white px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition shadow-sm">
                                        Reserve
                                    </button>
                                </div>
                            </div>
                        </div>`;
                });
            } catch (error) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-rose-500 bg-rose-50 rounded-2xl text-xs sm:text-sm font-semibold">Pipeline Error: Could not connect to homestays server.</div>`;
            }
        }

        // Initialize
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof applyLanguage === 'function') {
                const lang = localStorage.getItem("preferredLang") || "en";
                applyLanguage(lang);
            }
            loadVerifiedHomestays();
        });
    </script>
</body>
</html>
