<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGuwahati - Verified Local Homestays</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans flex flex-col justify-between">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 min-h-16 py-2 sm:py-0 flex flex-wrap sm:flex-nowrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-house-chimney text-teal-600 text-xl sm:text-2xl"></i>
                <span class="text-lg sm:text-xl font-bold text-teal-800">StayGuwahati</span>
            </div>
            
            <nav class="flex flex-wrap items-center gap-3 sm:gap-6 text-xs sm:text-sm font-medium text-gray-600 ml-auto sm:ml-0">
                <a href="index.html" id="navHome" class="text-teal-600 border-b-2 border-teal-600 pb-1">Home</a>
                <a href="map.html" id="navMap" class="hover:text-teal-600 transition">Explore Map</a>
                <a href="add-property.html" id="navProperty" class="hover:text-teal-600 transition">List Property</a>
                
                <select id="langSelector" class="bg-gray-50 border border-gray-200 rounded-lg p-1 text-xs font-bold text-gray-700 cursor-pointer">
                    <option value="en">English</option>
                    <option value="as">অসমীয়া</option>
                    <option value="hi">हिंदी</option>
                </select>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-6 sm:py-10">
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6 sm:mb-8">
            <div>
                <h1 id="mainTitle" class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Verified Local Homestays</h1>
                <p id="mainDesc" class="text-gray-500 mt-1 text-xs sm:text-sm md:text-base">Handpicked properties verified for hygiene, security, and warmth.</p>
            </div>
            <div class="bg-teal-50 text-teal-700 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-semibold border border-teal-100 self-start sm:self-auto">
                Showing <span id="propertyCount">0</span> <span id="showingLabel">active property options</span>
            </div>
        </div>

        <div id="homestayGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-8">
            <div class="col-span-full text-center py-12 text-gray-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-teal-500"></i>
                <p class="text-xs sm:text-sm">Connecting to database pipeline...</p>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 px-3 text-xs text-gray-400 border-t border-gray-100 bg-white mt-12">
        &copy; 2026 StayGuwahati Platform Unified Core Engine. All rights reserved.
    </footer>

    <script src="lang-manager.js"></script>
    <script>
        async function loadVerifiedHomestays() {
            const grid = document.getElementById("homestayGrid");
            const countLabel = document.getElementById("propertyCount");
            const BACKEND_URL = 'https://stayguwahati-backend.onrender.com';

            try {
                const response = await fetch(`${BACKEND_URL}/api/homestays`);
                let properties = await response.json();
                if (properties && properties.data) properties = properties.data;

                countLabel.textContent = properties.length;

                if (!properties || properties.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16 bg-white border border-gray-200 rounded-2xl shadow-sm">
                            <i class="fa-solid fa-hotel text-4xl text-gray-300 mb-3"></i>
                            <p class="font-semibold text-gray-700 text-xs sm:text-sm">No properties found</p>
                        </div>`;
                    return;
                }

                grid.innerHTML = "";
                properties.forEach(stay => {
                    console.log("Current Stay Object:", stay);
                    
                    let img = "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600";
                    if (stay.images && stay.images.length > 0) {
                        img = stay.images[0].startsWith('/uploads') ? `${BACKEND_URL}${stay.images[0]}` : stay.images[0];
                    }

                    grid.innerHTML += `
                        <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition duration-300 flex flex-col group">
                            <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                                <img src="${img}" alt="${stay.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            </div>
                            <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between">
                                <div>
                                    <span class="text-[10px] font-bold text-teal-600 uppercase tracking-widest">${stay.locality || 'Guwahati'}</span>
                                    <h3 class="font-bold text-base sm:text-lg text-gray-900 mt-1 truncate">${stay.title}</h3>
                                </div>
                                <div class="mt-4 sm:mt-6 pt-3 sm:pt-4 border-t border-gray-100 flex items-center justify-between">
                                    <span class="text-lg sm:text-xl font-extrabold text-gray-900">₹${stay.pricePerNight}</span>
                                    
                                    <button onclick="window.location.href='book-stay.html?id=${stay._id}'" 
                                            class="bg-slate-900 hover:bg-teal-600 text-white px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition shadow-sm">
                                        Reserve
                                    </button>
                                </div>
                            </div>
                        </div>`;
                });
            } catch (error) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-rose-500 bg-rose-50 rounded-2xl text-xs sm:text-sm">Pipeline Error: Check if backend is running on port 5000.</div>`;
            }
        }

        // Initialize
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof applyLanguage === 'function') {
                const lang = localStorage.getItem("preferredLang") || "en";
                applyLanguage(lang);
            }
            loadVerifiedHomestays();
        });
    </script>
</body>
</html>
