<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGuwahati | Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between font-sans">

    <header class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-house-chimney text-teal-600 text-2xl"></i>
                <span class="text-xl font-bold text-teal-800">StayGuwahati</span>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 max-w-sm w-full">
            <div class="text-center mb-8">
                <div class="bg-teal-50 text-teal-600 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-4 shadow-inner">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h1 class="text-2xl font-black text-gray-900 tracking-tight">Reset Password</h1>
                <p class="text-gray-400 text-xs mt-1">Enter your email to receive a reset link</p>
            </div>

            <div id="statusBanner" class="hidden p-3 rounded-xl mb-4 text-xs font-medium border">
                <i id="statusIcon" class="fa-solid mr-1.5"></i> <span id="statusMessage"></span>
            </div>

            <form id="forgotForm" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-teal-500 transition focus:ring-1 focus:ring-teal-500">
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-slate-900 hover:bg-teal-600 text-white font-bold py-3 rounded-xl text-sm transition mt-2 flex items-center justify-center gap-2 shadow-sm">
                    <span id="btnText">Send Reset Link</span>
                </button>
            </form>

            <div class="mt-8 text-center text-xs text-gray-500">
                <a href="login.html" class="text-teal-600 font-bold hover:underline">Back to Login</a>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-[10px] text-gray-400">
        <p>&copy; 2026 StayGuwahati Platform Unified Core.</p>
    </footer>

    <script>
        const forgotForm = document.getElementById("forgotForm");
        const statusBanner = document.getElementById("statusBanner");
        const statusMessage = document.getElementById("statusMessage");
        const statusIcon = document.getElementById("statusIcon");
        const submitBtn = document.getElementById("submitBtn");

        forgotForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;

            // UI Feedback
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...`;
            statusBanner.classList.add("hidden");

            try {
                const response = await fetch('http://localhost:5000/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.message || "Failed to send reset link.");

                // Success State
                statusBanner.className = "p-3 rounded-xl mb-4 text-xs font-medium border bg-emerald-50 border-emerald-100 text-emerald-600";
                statusIcon.className = "fa-solid fa-check-circle mr-1.5";
                statusMessage.textContent = "Check your email! Link sent successfully.";
                statusBanner.classList.remove("hidden");
                submitBtn.innerHTML = "Link Sent";

            } catch (err) {
                // Error State
                statusBanner.className = "p-3 rounded-xl mb-4 text-xs font-medium border bg-rose-50 border-rose-100 text-rose-600";
                statusIcon.className = "fa-solid fa-circle-exclamation mr-1.5";
                statusMessage.textContent = err.message;
                statusBanner.classList.remove("hidden");
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
