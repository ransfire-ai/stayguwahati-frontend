<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
}

/* Sidebar */
.sidebar {
  width: 220px;
  height: 100vh;
  background: #1e293b;
  color: white;
  position: fixed;
  padding: 20px;
}

.sidebar h2 {
  margin-bottom: 30px;
}

.sidebar a {
  display: block;
  color: #cbd5e1;
  padding: 10px 0;
  text-decoration: none;
}

.sidebar a:hover {
  color: white;
}

/* Main */
.main {
  margin-left: 240px;
  padding: 20px;
}

/* Cards */
.cards {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}

.card {
  flex: 1;
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

/* Table */
table {
  width: 100%;
  background: white;
  border-radius: 10px;
  border-collapse: collapse;
  overflow: hidden;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #eee;
}

th {
  background: #f1f5f9;
}

/* Status */
.status {
  padding: 5px 10px;
  border-radius: 5px;
  color: white;
  font-size: 12px;
}

.confirmed { background: green; }
.pending { background: orange; }

/* Button */
button {
  padding: 6px 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.delete {
  background: red;
  color: white;
}
</style>

</head>
<body>

<div class="sidebar">
  <h2>StayGuwahati</h2>
  <a href="#">Dashboard</a>
  <a href="#">Bookings</a>
  <a href="#">Properties</a>
  <a href="#">Logout</a>
</div>

<div class="main">

  <h1>Owner Dashboard</h1>

  <!-- Stats -->
  <div class="cards">
    <div class="card">
      <h3>Total Bookings</h3>
      <p id="totalBookings">0</p>
    </div>
    <div class="card">
      <h3>Revenue</h3>
      <p id="totalRevenue">₹0</p>
    </div>
    <div class="card">
      <h3>Pending</h3>
      <p id="pendingBookings">0</p>
    </div>
  </div>

  <!-- Booking Table -->
  <h2>Your Bookings</h2>

  <table>
    <thead>
      <tr>
        <th>Property</th>
        <th>Guest</th>
        <th>Date</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="bookings">
      <!-- Data will come here -->
    </tbody>
  </table>

</div>

<script>

const USER_ID = "YOUR_USER_ID"; // replace

async function loadBookings() {
  try {
    const res = await fetch(`http://localhost:3000/owner-bookings/${USER_ID}`);
    const data = await res.json();

    const container = document.getElementById("bookings");

    // FIX: check null
    if (!container) return;

    container.innerHTML = "";

    let total = 0;
    let revenue = 0;
    let pending = 0;

    data.forEach(b => {

      total++;

      if (b.status === "pending") pending++;
      if (b.price) revenue += b.price;

      container.innerHTML += `
        <tr>
          <td>${b.propertyName || "N/A"}</td>
          <td>${b.guestName || "Guest"}</td>
          <td>${b.date || "-"}</td>
          <td>
            <span class="status ${b.status}">
              ${b.status}
            </span>
          </td>
          <td>
            <button class="delete" onclick="deleteBooking('${b._id}')">
              Delete
            </button>
          </td>
        </tr>
      `;
    });

    // Update stats
    document.getElementById("totalBookings").innerText = total;
    document.getElementById("totalRevenue").innerText = "₹" + revenue;
    document.getElementById("pendingBookings").innerText = pending;

  } catch (err) {
    console.error("Error loading bookings:", err);
  }
}

async function deleteBooking(id) {
  if (!confirm("Delete this booking?")) return;

  try {
    await fetch(`http://localhost:3000/delete-booking/${id}`, {
      method: "DELETE"
    });

    loadBookings();

  } catch (err) {
    console.error("Delete failed:", err);
  }
}

loadBookings();

</script>

</body>
</html>
