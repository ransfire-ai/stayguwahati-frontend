<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGuwahati | Edit Property</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans flex flex-col justify-between">

    <header class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='dashboard.html'">
                <span class="text-sm font-bold text-teal-600 mr-1">A.</span>
                <i class="fa-solid fa-arrow-left text-teal-600 text-lg"></i>
                <span class="text-sm font-bold text-gray-600">Back to Dashboard</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto p-6">
        <div class="bg-white border border-gray-100 p-6 rounded-2xl shadow-sm space-y-4">
            <div>
                <h1 class="text-xl font-black text-gray-900 tracking-tight">Modify Property Details</h1>
                <p class="text-gray-400 text-xs mt-1">Update your listing information instantly across the directory.</p>
            </div>

            <form id="editPropertyForm" class="space-y-4 text-xs">
                <div>
                    <label class="block text-gray-500 font-bold mb-1 uppercase tracking-wider">Property Title</label>
                    <input type="text" id="propTitle" class="w-full border border-gray-200 rounded-xl p-2.5 font-medium focus:outline-teal-500" required>
                </div>
                <div>
                    <label class="block text-gray-500 font-bold mb-1 uppercase tracking-wider">Locality Area</label>
                    <input type="text" id="propLocality" class="w-full border border-gray-200 rounded-xl p-2.5 font-medium focus:outline-teal-500" required>
                </div>
                <div>
                    <label class="block text-gray-500 font-bold mb-1 uppercase tracking-wider">Price Per Night (₹)</label>
                    <input type="number" id="propPrice" class="w-full border border-gray-200 rounded-xl p-2.5 font-medium focus:outline-teal-500" required>
                </div>
                
                <button type="submit" class="w-full bg-slate-950 hover:bg-teal-600 text-white font-bold py-2.5 rounded-xl transition shadow-sm mt-2">
                    Save Structural Updates
                </button>
            </form>
        </div>
    </main>

    <script>
        // 📋 Extract the query parameter ID from the current browser URL bar
        const urlParams = new URLSearchParams(window.location.search);
        const propertyId = urlParams.get('id');

        if (!propertyId) {
            alert("No valid property sequence ID detected targeting this execution pipeline.");
            window.location.href = "dashboard.html";
        }

        // Run data fetching routines when window initialization maps are completed
        window.onload = async function() {
            try {
                const res = await fetch(`http://localhost:5000/api/homestays/${propertyId}`);
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('propTitle').value = data.data.title || '';
                    document.getElementById('propLocality').value = data.data.locality || '';
                    document.getElementById('propPrice').value = data.data.pricePerNight || '';
                }
            } catch (err) {
                console.error("Failed synchronization pipeline mapping error context:", err);
            }
        };

        // Form submission intercept logic to commit backend updates
        document.getElementById('editPropertyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const updatedData = {
                title: document.getElementById('propTitle').value,
                locality: document.getElementById('propLocality').value,
                pricePerNight: document.getElementById('propPrice').value
            };

            try {
                const res = await fetch(`http://localhost:5000/api/homestays/${propertyId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });
                const data = await res.json();

                if (data.success) {
                    alert("Homestay changes written cleanly to database registers!");
                    window.location.href = "dashboard.html";
                } else {
                    alert("Write failed: " + data.message);
                }
            } catch (err) {
                alert("Server pipeline synchronization failure.");
            }
        });
    </script>
<script src="lang-manager.js"></script>
</body>
</html>
